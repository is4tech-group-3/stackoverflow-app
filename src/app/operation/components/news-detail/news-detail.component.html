<div class="max-w-screen-xl mx-auto p-5 sm:p-8 md:p-12 relative">
  <div
    class="bg-cover h-128 bg-center rounded-lg text-center overflow-hidden"
    style="
      height: 450px;
      background-image: url('{{ publication.image }}');
    "
  ></div>
  <div class="max-w-2xl mx-auto">
    <div
      class="mt-3 bg-white rounded-b lg:rounded-b-none lg:rounded-r flex flex-col justify-between leading-normal"
    >
      <div class="">
        <span
          *ngFor="let tag of publication.tags"
          href="#"
          class="inline-flex items-center mr-2 gap-x-1.5 py-1.5 px-3 rounded-md text-xs font-medium border border-gray-200 bg-white text-gray-800 shadow-sm"
        >
          {{ tag.name }}
        </span>

        <h1 href="#" class="text-gray-900 font-bold text-3xl mb-2">
          {{ publication.title }}
        </h1>
        <div class="flex justify-between">
          <p class="text-gray-700 text-sm mt-2">
            {{ 'news.written' | translate }}
            <span
              class="text-indigo-600 font-medium hover:text-gray-900 transition duration-500 ease-in-out capitalize"
            >
              {{ publication.author.name + ' ' + publication.author.surname }}
            </span>
          </p>
          <p class="text-gray-700 text-sm mt-2">
            {{ publication.dateCreation | dateFormat: 'FORMAT-1' }}
          </p>
        </div>

        <p
          class="text-base leading-8 my-5"
          [innerHTML]="publication.description"
        ></p>
      </div>
    </div>
  </div>
</div>
