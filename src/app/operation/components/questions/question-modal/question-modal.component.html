<div
    class="fixed top-0 left-0 inset-0 p-4 flex justify-center items-start sm:items-center w-full h-full z-[1000] before:fixed before:inset-0 before:w-full before:h-full before:bg-[rgba(0,0,0,0.5)] overflow-auto">
    <div class="w-full max-w-5xl bg-white shadow-lg rounded-lg p-6 relative mt-4 sm:mt-0">
        <div class="flex items-center pb-3 border-b border-gray-300">
            <h3 class="text-gray-800 text-xl font-bold flex-1">{{ 'questions.title' | translate}}</h3>
            <button (click)="close()">
                <mat-icon aria-label="close">close</mat-icon>
            </button>
        </div>

        <form class="flex flex-col sm:flex-row sm:justify-between mt-4">
            <div class="w-full sm:w-1/2 sm:pr-4">
                <div class="w-full">
                    <label class="text-gray-800 font-semibold text-sm block">{{ 'input.questiontitle.label' |
                        translate}}</label>
                    <div class="relative flex items-center group">
                        <input type="text" [(ngModel)]="title" name="title" required
                            class="w-full bg-transparent text-sm border-b border-gray-300 focus:border-dark-gunmetal px-2 py-3 outline-none"
                            placeholder="{{'input.questiontitle.placeholder' | translate}}" />
                        <div
                            class="w-[18px] h-[18px] absolute right-4 text-gray-300 group-focus-within:text-dark-gunmetal">
                        </div>
                    </div>
                </div>
                <div class="w-full mt-4">
                    <label class="block text-sm font-medium">{{ 'input.questionDescription.label' |
                        translate}}</label>
                    <textarea #mdeEditor class="w-full custom-editor p-2 border rounded-md"></textarea>
                </div>
            </div>

            <div class="w-full sm:w-1/2 flex flex-col items-center justify-center mt-4 sm:mt-0">
                <label class="text-xl font-medium pb-5">{{ 'questions.data.tags' | translate}}</label>
                <div *ngIf="tags.length > 0" class="w-full">
                    <div class="flex flex-wrap gap-2 text-sm font-medium lowercase justify-center items-center">
                        <span class="flex items-center cursor-pointer" *ngFor="let tag of tags"
                            [ngClass]="{'bg-blue-200': isTagSelected(tag.idTag)}"
                            (click)="toggleTagSelection(tag.idTag)">
                            <img *ngIf="getTagClass(tag.name).iconUrl" [src]="getTagClass(tag.name).iconUrl"
                                alt="{{tag.name}}" class="w-4 h-4 tag-icon">
                            <span class="first-letter:uppercase">{{ tag.name }}</span>
                        </span>
                    </div>
                </div>
                <div class="mt-4 w-full flex justify-center">
                    <ng-container>
                        <mat-paginator [length]="totalItems" [pageIndex]="currentPage" [hidePageSize]="true"
                            [pageSize]="10" (page)="handlePageEvent($event)">
                        </mat-paginator>
                    </ng-container>
                </div>
            </div>
        </form>
        <div class="mt-6 flex justify-end gap-4 border-t pt-4">
            <button (click)="close()" type="button"
                class="px-4 py-2 rounded-md text-gray-800 text-sm bg-gray-200 hover:bg-gray-300">{{ 'button.cancel' |
                translate}}</button>
            <button (click)="saveQuestion()" type="button"
                class="px-4 py-2 rounded-md text-white text-sm bg-sunset-orange-500 hover:bg-sunset-orange-700">{{
                'button.save' | translate}}</button>
        </div>
    </div>
</div>
