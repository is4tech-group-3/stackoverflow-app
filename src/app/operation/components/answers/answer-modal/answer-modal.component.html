<div
    class="fixed top-0 left-0 inset-0 p-4 flex justify-center items-start sm:items-center w-full h-full z-[1000] before:fixed before:inset-0 before:w-full before:h-full before:bg-[rgba(0,0,0,0.5)] overflow-auto">
    <div class="w-full max-w-2xl bg-white shadow-lg rounded-lg p-6 relative mt-4 sm:mt-0">
        <div class="flex items-center pb-3 border-b border-gray-300">
            <h3 class="text-gray-800 text-xl font-bold flex-1">{{ 'answers.data.titleModal' | translate }}</h3>
            <button (click)="close()">
                <mat-icon aria-label="close">close</mat-icon>
            </button>
        </div>
        <form class="flex flex-col mt-4">
            <div class="w-full">
                <label class="block text-sm font-medium">{{ 'input.questionDescription.label' | translate }}</label>
                <textarea #mdeEditor class="w-full custom-editor p-2 border rounded-md"></textarea>
            </div>
        </form>
        <div class="mt-6 flex justify-end gap-4 border-t pt-4">
            <button (click)="close()" type="button"
                class="px-4 py-2 rounded-md text-gray-800 text-sm bg-gray-200 hover:bg-gray-300">{{ 'button.cancel' |
                translate }}</button>
            <button (click)="saveAnswer()" type="button"
                class="px-4 py-2 rounded-md text-white text-sm bg-sunset-orange-500 hover:bg-sunset-orange-700">{{
                'button.save' | translate }}</button>
        </div>
    </div>
</div>
