<div class="flex flex-col max-h-full h-full">
    <div class="flex-1 overflow-auto">
        <div class="w-full p-4 sm:p-6 flex flex-col">
            <div class="bg-white rounded-lg shadow-[0_2px_10px_rgba(0,0,0,0.2)] p-4 sm:p-6 w-full">
                <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mb-2">
                    <img src="../../../../assets/img/Profile2.jpg" alt="User"
                        class="w-12 h-12 rounded-full mx-auto sm:mx-0">
                    <div class="flex-1" *ngIf="question">
                        <div
                            class="flex flex-col sm:flex-row justify-center items-center lg:justify-between lg:items-start mb-2">
                            <div>
                                <h3 class="text-lg font-semibold text-center sm:text-center lg:text-left">{{
                                    question.author.username }}
                                </h3>
                                <p class="text-sm text-gray-500 pb-4 text-center sm:text-center lg:text-left">{{
                                    question.dateCreation | dateFormat:'FORMAT-1' }}</p>
                            </div>
                            <div class="space-x-4 text-center sm:text-left">
                                <button class="text-metallic-blue text-sm"
                                    (click)="openQuestionModal(question.idQuestion)">
                                    <mat-icon aria-label="reply">reply</mat-icon>
                                </button>
                            </div>
                        </div>
                        <div class="text-gray-700 space-y-3">
                            <h2 class="text-xl font-semibold text-center sm:text-left mb-2">{{ question.title }}</h2>
                        </div>
                        <div class="text-gray-700 space-y-3">
                            <p [innerHTML]="question.description"></p>
                        </div>
                        <div
                            class="flex items-center justify-center sm:justify-start text-sm font-medium flex-wrap gap-2 lowercase pt-3">
                            <span class="flex items-center" *ngFor="let tag of question.tags"
                                [ngClass]="getTagClass(tag.name).class">
                                <img *ngIf="getTagClass(tag.name).iconUrl" [src]="getTagClass(tag.name).iconUrl"
                                    alt="{{tag.name}}" class="w-4 h-4 tag-icon">
                                <span class="first-letter:uppercase">{{ tag.name }}</span>
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="w-full p-4 sm:p-6 pt-0 flex flex-col">
            <div class="bg-white rounded-lg shadow-[0_2px_10px_rgba(0,0,0,0.2)] px-4 sm:px-6 pt-4 w-full">
                <div class="border-b border-gray-300 pb-4 mb-6">
                    <h2 class="text-xl sm:text-2xl font-semibold text-gray-700 text-center sm:text-left">{{
                        'answers.title' | translate }}</h2>
                </div>
                <div *ngFor="let answer of answers" class="answer-item flex flex-col mb-8">
                    <div class="flex space-y-4 sm:space-y-0 sm:space-x-4 flex-col sm:flex-row">
                        <img src="../../../../assets/img/Profile2.jpg" alt="User"
                            class="w-12 h-12 rounded-full mx-auto sm:mx-0">
                        <div class="flex-1">
                            <div
                                class="flex flex-col sm:flex-row justify-center items-center lg:justify-between lg:items-start mb-2">

                                <div>
                                    <h3 class="text-lg font-semibold text-center sm:text-left">{{ answer.author.username
                                        }}</h3>
                                    <p class="text-sm text-gray-500 pb-3 text-center sm:text-left">{{ answer.dateCreated
                                        | dateFormat:'FORMAT-1' }}</p>
                                </div>
                                <div class="flex items-center justify-center sm:justify-start space-x-4">
                                    <div class="flex items-center space-x-1">
                                        <button class="text-metallic-blue text-sm">
                                            <mat-icon aria-label="thumb_up">thumb_up</mat-icon>
                                        </button>
                                        <span class="text-gray-500 text-sm">{{ answer.likes || 0 }}</span>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <button mat-menu-item (click)="openAnswerModal(answer.idAnswer)">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="text-gray-700 space-y-3">
                                <p [innerHTML]="answer.description"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
